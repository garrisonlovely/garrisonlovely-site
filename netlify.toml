[build]
  publish = "."

# /red (a.k.a. /blue) = theme preview: baby-blue accents, new cover, book panel
# styled to match obsoletebook.org. Main site is still mint. Both paths serve the
# same file — /red kept alive because the link is already shared around.
[[redirects]]
  from = "/blue"
  to = "/index-red.html"
  status = 200

[[redirects]]
  from = "/blue/"
  to = "/index-red.html"
  status = 200

[[redirects]]
  from = "/red"
  to = "/index-red.html"
  status = 200

[[redirects]]
  from = "/red/"
  to = "/index-red.html"
  status = 200

# Purge Cloudflare cache after every successful deploy. Requires Netlify env var
# CLOUDFLARE_API_TOKEN to be set (cache:purge-scoped token for this zone).
[[plugins]]
  package = "./netlify/plugins/cf-purge"
  [plugins.inputs]
    zoneId = "237fff11377c635a3f2998e57a6b2488"
