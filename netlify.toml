[build]
  publish = "."

# The baby-blue theme IS the main site as of July 2026.
# /blue and /red still resolve there so previously shared links keep working.
# /mint = the previous mint-accent site, preserved.
[[redirects]]
  from = "/blue"
  to = "/"
  status = 301

[[redirects]]
  from = "/blue/"
  to = "/"
  status = 301

[[redirects]]
  from = "/red"
  to = "/"
  status = 301

[[redirects]]
  from = "/red/"
  to = "/"
  status = 301

[[redirects]]
  from = "/mint"
  to = "/index-mint.html"
  status = 200

[[redirects]]
  from = "/mint/"
  to = "/index-mint.html"
  status = 200

# Purge Cloudflare cache after every successful deploy. Requires Netlify env var
# CLOUDFLARE_API_TOKEN to be set (cache:purge-scoped token for this zone).
[[plugins]]
  package = "./netlify/plugins/cf-purge"
  [plugins.inputs]
    zoneId = "237fff11377c635a3f2998e57a6b2488"

# Podcast site preview — kept out of search indexes at the header level too,
# in case the meta tag is missed. Deliberately NOT listed in robots.txt, since
# that file is public and would advertise the path.
[[headers]]
  for = "/oatm-preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
