[build]
  publish = "."

# The baby-blue theme IS the main site as of July 2026.
# /blue and /red still resolve there so previously shared links keep working.
# /mint = the previous mint-accent site, preserved.
[[redirects]]
  from = "/blue"
  to = "/"
  status = 301

[[redirects]]
  from = "/blue/"
  to = "/"
  status = 301

[[redirects]]
  from = "/red"
  to = "/"
  status = 301

[[redirects]]
  from = "/red/"
  to = "/"
  status = 301

[[redirects]]
  from = "/mint"
  to = "/index-mint.html"
  status = 200

[[redirects]]
  from = "/mint/"
  to = "/index-mint.html"
  status = 200

# Purge Cloudflare cache after every successful deploy. Requires Netlify env var
# CLOUDFLARE_API_TOKEN to be set (cache:purge-scoped token for this zone).
[[plugins]]
  package = "./netlify/plugins/cf-purge"
  [plugins.inputs]
    zoneId = "237fff11377c635a3f2998e57a6b2488"

# The podcast site moved to its own domain on 2026-08-24. The preview path
# redirects so any link shared while it lived here still lands somewhere real.
[[redirects]]
  from = "/oatm-preview/*"
  to = "https://oatmpod.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/oatm-preview"
  to = "https://oatmpod.com/"
  status = 301
  force = true
